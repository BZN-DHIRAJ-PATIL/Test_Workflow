
name: HDFC EPIL Workflow

on:
  workflow_dispatch:

jobs:
  run-converter:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout Repository
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ==========================================
      # Setup Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # ==========================================
      # Prepare Runtime Folders
      # ==========================================
      - name: Prepare Runtime Folders
        run: |
          mkdir -p INPUT
          mkdir -p OUTPUT
          mkdir -p SUCCESS
          mkdir -p FAILURE
          mkdir -p Log

          echo "===== INPUT FILES ====="
          ls -lah INPUT

      # ==========================================
      # Give Execute Permission
      # ==========================================
      - name: Give Execute Permission
        run: chmod +x run.sh

      # ==========================================
      # Run Converter
      # ==========================================
      - name: Run Converter
        run: |
          sh run.sh

      # ==========================================
      # Display Runtime Logs
      # ==========================================
      - name: Display Logs
        if: always()
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== INPUT ====="
          ls -R INPUT || true

          echo "===== OUTPUT ====="
          ls -R OUTPUT || true

          echo "===== SUCCESS ====="
          ls -R SUCCESS || true

          echo "===== FAILURE ====="
          ls -R FAILURE || true

          echo "===== LOG ====="
          ls -R Log || true

          echo "===== LOG CONTENT ====="
          cat Log/* || true

      # ==========================================
      # Upload Output and Logs
      # ==========================================
      - name: Upload Output and Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HDFC-RESULT
          path: |
            OUTPUT/
            SUCCESS/
            FAILURE/
            Log/
            fileCounter.properties
          if-no-files-found: warn

